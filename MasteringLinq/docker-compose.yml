name: masteringlinq

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: masteringlinq-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StarWars_Pwd123!}
      MSSQL_PID: Developer
      # Limite la RAM de SQL Server (Mo) pour ne pas affamer Docker Desktop / WSL2.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-8192}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}"
        -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  sqldata:
